version: '3.8'

# Full Docker Compose configuration for local development
# This file includes all services with complete environment configuration
# Usage: docker-compose -f docker-compose.full.yml up -d
#
# SECURITY NOTE: Default passwords are for local development only.
# For production deployments, set secure values via environment variables:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: client-management-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-client_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: client-management-backend
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-client_management}?schema=public
      
      # Server Configuration
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      
      # CORS Configuration
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      
      # Traccar SMS Gateway Configuration
      - TRACCAR_SMS_URL=${TRACCAR_SMS_URL:-http://localhost:5055}
      - TRACCAR_SMS_DEVICE_ID=${TRACCAR_SMS_DEVICE_ID}
      - TRACCAR_API_TOKEN=${TRACCAR_API_TOKEN}
      
      # Cloudflare Tunnel Configuration
      - CLOUDFLARE_TUNNEL_URL=${CLOUDFLARE_TUNNEL_URL}
      
      # Rate Limiting Configuration
      - SMS_RATE_LIMIT_PER_MINUTE=${SMS_RATE_LIMIT_PER_MINUTE:-30}
      - SMS_RATE_LIMIT_PER_HOUR=${SMS_RATE_LIMIT_PER_HOUR:-500}
      - SMS_MAX_RETRIES=${SMS_MAX_RETRIES:-5}
      - SMS_RETRY_DELAY_MS=${SMS_RETRY_DELAY_MS:-60000}
      - API_RATE_LIMIT_MAX=${API_RATE_LIMIT_MAX:-100}
      - API_RATE_LIMIT_WINDOW_MINUTES=${API_RATE_LIMIT_WINDOW_MINUTES:-15}
      
      # SMS Best Practices Configuration
      - SMS_MAX_PER_RECIPIENT_PER_DAY=${SMS_MAX_PER_RECIPIENT_PER_DAY:-3}
      - SMS_MAX_PER_RECIPIENT_PER_WEEK=${SMS_MAX_PER_RECIPIENT_PER_WEEK:-10}
      - SMS_RECIPIENT_COOLDOWN_HOURS=${SMS_RECIPIENT_COOLDOWN_HOURS:-4}
      - SMS_ALLOWED_START_HOUR=${SMS_ALLOWED_START_HOUR:-9}
      - SMS_ALLOWED_END_HOUR=${SMS_ALLOWED_END_HOUR:-20}
      - SMS_TIMEZONE=${SMS_TIMEZONE:-Europe/Bucharest}
      - SMS_MAX_LENGTH=${SMS_MAX_LENGTH:-480}
      - SMS_PREVENT_DUPLICATES=${SMS_PREVENT_DUPLICATES:-true}
      - SMS_DUPLICATE_WINDOW_HOURS=${SMS_DUPLICATE_WINDOW_HOURS:-24}
      - SMS_SENDER_NAME=${SMS_SENDER_NAME:-YourCompany}
      - SMS_OPT_OUT_KEYWORD=${SMS_OPT_OUT_KEYWORD:-STOP}
      - SMS_REQUIRE_OPT_OUT_INFO=${SMS_REQUIRE_OPT_OUT_INFO:-true}
      - SMS_DEFAULT_COUNTRY_CODE=${SMS_DEFAULT_COUNTRY_CODE:-+40}
      
      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-info}
      
      # Excel Import Configuration
      - EXCEL_DATA_DIRECTORY=${EXCEL_DATA_DIRECTORY:-./data}
      
      # Message Queue Configuration
      - QUEUE_PROCESS_INTERVAL_MS=${QUEUE_PROCESS_INTERVAL_MS:-5000}
      - QUEUE_BATCH_SIZE=${QUEUE_BATCH_SIZE:-10}
    ports:
      - "3001:3001"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: client-management-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
