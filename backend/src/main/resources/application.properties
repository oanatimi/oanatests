# Quarkus Configuration

# Application name
quarkus.application.name=client-management-backend

# HTTP server configuration
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# CORS configuration
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGIN:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Location,Info
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:serviceauto}?sslmode=${DB_SSL_MODE:prefer}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.acquisition-timeout=10S

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=com.clientmanagement.config.QuotedPhysicalNamingStrategy

# Flyway configuration for database migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Health check configuration
quarkus.smallrye-health.root-path=/health

# HTTP request logging
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b "%{i,Referer}" "%{i,User-Agent}" %D

# Logging configuration
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.json=${QUARKUS_LOG_JSON:false}
quarkus.log.category."com.clientmanagement".level=DEBUG

# SMS Service Configuration
sms.traccar.url=${TRACCAR_SMS_URL:}
sms.traccar.device-id=${TRACCAR_SMS_DEVICE_ID:}
sms.traccar.api-token=${TRACCAR_API_TOKEN:}
sms.cloudflare.tunnel-url=${CLOUDFLARE_TUNNEL_URL:}

# SMS Rate Limits
sms.rate-limit.per-minute=${SMS_RATE_LIMIT_PER_MINUTE:30}
sms.rate-limit.per-hour=${SMS_RATE_LIMIT_PER_HOUR:500}
sms.rate-limit.max-retries=${SMS_MAX_RETRIES:5}
sms.rate-limit.retry-delay-ms=${SMS_RETRY_DELAY_MS:60000}

# SMS Best Practices
sms.best-practices.max-per-recipient-per-day=${SMS_MAX_PER_RECIPIENT_PER_DAY:3}
sms.best-practices.max-per-recipient-per-week=${SMS_MAX_PER_RECIPIENT_PER_WEEK:10}
sms.best-practices.recipient-cooldown-hours=${SMS_RECIPIENT_COOLDOWN_HOURS:4}
sms.best-practices.allowed-start-hour=${SMS_ALLOWED_START_HOUR:9}
sms.best-practices.allowed-end-hour=${SMS_ALLOWED_END_HOUR:20}
sms.best-practices.timezone=${SMS_TIMEZONE:Europe/Bucharest}
sms.best-practices.max-length=${SMS_MAX_LENGTH:480}
sms.best-practices.prevent-duplicates=${SMS_PREVENT_DUPLICATES:true}
sms.best-practices.duplicate-window-hours=${SMS_DUPLICATE_WINDOW_HOURS:24}
sms.best-practices.sender-name=${SMS_SENDER_NAME:YourCompany}
sms.best-practices.opt-out-keyword=${SMS_OPT_OUT_KEYWORD:STOP}
sms.best-practices.require-opt-out-info=${SMS_REQUIRE_OPT_OUT_INFO:true}
sms.best-practices.default-country-code=${SMS_DEFAULT_COUNTRY_CODE:+40}

# API Rate Limits
api.rate-limit.max=${API_RATE_LIMIT_MAX:100}
api.rate-limit.window-minutes=${API_RATE_LIMIT_WINDOW_MINUTES:15}

# Queue Configuration
queue.process-interval-seconds=${QUEUE_PROCESS_INTERVAL_SECONDS:5}
queue.batch-size=${QUEUE_BATCH_SIZE:10}

# Excel Import Configuration
excel.data-directory=${EXCEL_DATA_DIRECTORY:./data}
